<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Barra de Sonido Interactivo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stage" id="stage">
    <div class="chroma-bg" id="chromaBg"></div>

    <canvas id="smokeCanvas"></canvas>

    <div class="bars" id="barsContainer"></div>

    <button id="toggleControls" class="toggle-controls-btn" title="Ocultar/mostrar controles">⚙</button>

    <div class="controls" id="controlsPanel">
      <div class="control-group">
        <button id="micBtn" class="mini-btn wide primary">🎤 Activar micrófono</button>
      </div>
      <div class="hud-status" id="status">Esperando permiso de micrófono…</div>
      <div class="control-group">
        <label for="bgColor">Fondo (chroma)</label>
        <input type="color" id="bgColor" value="#00ff47" />
        <button id="bgReset" class="mini-btn" title="Restablecer verde chroma">↺</button>
      </div>
      <div class="control-group">
        <label for="barColor">Color de barra</label>
        <input type="color" id="barColor" value="#ff2fd0" />
        <button id="barReset" class="mini-btn" title="Restablecer color de barra">↺</button>
      </div>
      <div class="control-group slider-group">
        <label for="sensitivity">Sensibilidad</label>
        <input type="range" id="sensitivity" min="0.5" max="2.5" step="0.1" value="1.2" />
      </div>
      <div class="control-group slider-group">
        <label for="threshold">Umbral humo (dB): <span id="thresholdValue">-45</span></label>
        <input type="range" id="threshold" min="-90" max="-20" step="1" value="-45" />
      </div>
      <div class="control-group slider-group">
        <label for="barCount">Número de barras: <span id="barCountValue">28</span></label>
        <input type="range" id="barCount" min="4" max="64" step="1" value="28" />
      </div>
      <button id="clearSmoke" class="mini-btn wide">Limpiar humo</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
